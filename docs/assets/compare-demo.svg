<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><rect width="1600" height="950" fill="#f5f7f9"/><rect width="1600" height="76" fill="#fff"/><text x="30" y="50" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#262b31">Compare Document Tabs</text><rect x="1295" y="20" width="140" height="42" rx="8" fill="#14a7d0"/><text x="1330" y="48" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Compare</text><rect x="55" y="105" width="680" height="55" rx="10" fill="#fff" stroke="#d6dbe1"/><rect x="865" y="105" width="680" height="55" rx="10" fill="#fff" stroke="#d6dbe1"/><text x="80" y="140" font-family="Arial,sans-serif" font-size="19" fill="#333b44">Original — The Little Prince</text><text x="890" y="140" font-family="Arial,sans-serif" font-size="19" fill="#333b44">Revision — The Little Prince</text><g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#49535d"><rect x="55" y="175" width="16" height="16" fill="#39a96b"/><text x="81" y="189">New</text><rect x="180" y="175" width="16" height="16" fill="#18a7c7"/><text x="206" y="189">Moved</text><rect x="325" y="175" width="16" height="16" fill="#9467bd"/><text x="351" y="189">Split</text><rect x="455" y="175" width="16" height="16" fill="#f4a91f"/><text x="481" y="189">Modified</text></g><rect x="45" y="205" width="740" height="695" rx="12" fill="#fff" stroke="#d4d9df"/><rect x="815" y="205" width="740" height="695" rx="12" fill="#fff" stroke="#d4d9df"/><g font-family="Arial,sans-serif" font-size="18" fill="#202832"><rect x="75" y="240" width="680" height="120" rx="8" fill="#fff"/><text x="90" y="270" font-weight="700" fill="#2f7b91">1</text><text x="130" y="270">The little prince sat beside the aviator</text><text x="130" y="299">and watched the desert turn gold.</text><rect x="845" y="240" width="680" height="120" rx="8" fill="#fff6df"/><text x="860" y="270" font-weight="700" fill="#2f7b91">1</text><text x="900" y="270">The little prince sat beside the aviator while</text><text x="900" y="299">the desert turned gold in the evening light.</text><rect x="75" y="395" width="680" height="120" rx="8" fill="#eef9fc"/><text x="90" y="425" font-weight="700" fill="#2f7b91">2</text><text x="130" y="425">He said the stars were beautiful because</text><text x="130" y="454">of a flower that could not be seen.</text><rect x="845" y="395" width="680" height="120" rx="8" fill="#eef9fc"/><text x="860" y="425" font-weight="700" fill="#2f7b91">2</text><text x="900" y="425">He said the stars were beautiful because</text><text x="900" y="454">somewhere among them a flower was waiting.</text><rect x="75" y="550" width="680" height="120" rx="8" fill="#fff"/><text x="90" y="580" font-weight="700" fill="#2f7b91">3</text><text x="130" y="580">On his planet, the rose had four thorns</text><text x="130" y="609">and a very proud voice.</text><rect x="845" y="550" width="680" height="120" rx="8" fill="#fff6df"/><text x="860" y="580" font-weight="700" fill="#2f7b91">3</text><text x="900" y="580">On his tiny planet, the rose had four thorns,</text><text x="900" y="609">a proud voice, and a fragile heart.</text><rect x="75" y="705" width="680" height="120" rx="8" fill="#eef9fc"/><text x="90" y="735" font-weight="700" fill="#2f7b91">4</text><text x="130" y="735">He learned that grown-ups often preferred</text><text x="130" y="764">numbers to stories.</text><rect x="845" y="705" width="680" height="120" rx="8" fill="#fff6df"/><text x="860" y="735" font-weight="700" fill="#2f7b91">4</text><text x="900" y="735">He learned that grown-ups often trusted</text><text x="900" y="764">numbers more than stories.</text></g></svg>