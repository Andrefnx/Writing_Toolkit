  <text x="800" y="245" fill="#28323d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Original — El Principito</text><text x="1160" y="245" fill="#28323d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Revisión</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#202832">
    <rect x="795" y="275" width="310" height="72" rx="7" fill="#fff"/><text x="812" y="306">El principito miró</text><text x="812" y="330">el atardecer.</text><rect x="1150" y="275" width="300" height="72" rx="7" fill="#eef9f2"/><text x="1167" y="306">El principito miró el atardecer</text><text x="1167" y="330" fill="#16884f">en silencio.</text>
    <rect x="795" y="370" width="310" height="72" rx="7" fill="#eef7fb"/><text x="812" y="401">Preguntó al aviador</text><text x="812" y="425">por las estrellas.</text><rect x="1150" y="370" width="300" height="72" rx="7" fill="#eef9f2"/><text x="1167" y="401">Preguntó al aviador</text><text x="1167" y="425" fill="#16884f">por qué importaban las estrellas.</text>
    <rect x="795" y="465" width="310" height="72" rx="7" fill="#fff"/><text x="812" y="496">Una rosa esperaba</text><text x="812" y="520">en su pequeño planeta.</text><rect x="1150" y="465" width="300" height="72" rx="7" fill="#eef9f2"/><text x="1167" y="496">Una rosa </text><text x="1232" y="496" fill="#16884f">orgullosa</text><text x="1310" y="496"> esperaba</text><text x="1167" y="520">en su planeta.</text>
    <rect x="795" y="560" width="310" height="72" rx="7" fill="#eef7fb"/><text x="812" y="591">Los adultos preferían</text><text x="812" y="615">los números.</text><rect x="1150" y="560" width="300" height="72" rx="7" fill="#fff7ef"/><text x="1167" y="591">Los adultos </text><text x="1260" y="591" fill="#b43b3b" text-decoration="line-through">preferían</text><text x="1337" y="591" fill="#16884f"> confiaban</text><text x="1167" y="615" fill="#16884f">más en los números.</text>
  </g>
