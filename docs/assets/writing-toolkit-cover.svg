<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b0f14"/><g fill="none" stroke="#17202a"><path d="M0 80h1600M0 160h1600M0 240h1600M0 320h1600M0 400h1600M0 480h1600M0 560h1600M0 640h1600M0 720h1600M0 800h1600"/></g><text x="90" y="145" fill="#f3f7fb" font-family="Arial,sans-serif" font-size="62" font-weight="700">Writing Toolkit</text><text x="94" y="190" fill="#16a8d3" font-family="Arial,sans-serif" font-size="22" font-weight="700">GOOGLE DOCS WRITING &amp; REVISION TOOLS</text><text x="94" y="260" fill="#d7dee7" font-family="Arial,sans-serif" font-size="30">Cuenta palabras, compara versiones y exporta a HTML</text><text x="94" y="302" fill="#d7dee7" font-family="Arial,sans-serif" font-size="30">sin salir de Google Docs.</text><g font-family="Arial,sans-serif"><rect x="95" y="390" width="235" height="88" rx="14" fill="#101923" stroke="#263442"/><text x="113" y="425" fill="#18b5dc" font-size="20" font-weight="700">WORD COUNT</text><text x="113" y="455" fill="#c5ced8" font-size="17">Desglose por pestaña</text><rect x="365" y="390" width="235" height="88" rx="14" fill="#101923" stroke="#263442"/><text x="383" y="425" fill="#f5b23f" font-size="20" font-weight="700">COMPARE</text><text x="383" y="455" fill="#c5ced8" font-size="17">Cambios y movimientos</text><rect x="95" y="510" width="235" height="88" rx="14" fill="#101923" stroke="#263442"/><text x="113" y="545" fill="#18b5dc" font-size="20" font-weight="700">HTML</text><text x="113" y="575" fill="#c5ced8" font-size="17">Exportación rápida</text></g><rect x="760" y="120" width="750" height="640" rx="26" fill="#121820" stroke="#34414f" stroke-width="3"/><rect x="795" y="160" width="680" height="560" rx="14" fill="#f7f9fb"/><rect x="795" y="160" width="680" height="50" fill="#eef2f5"/><text x="815" y="192" fill="#3d454e" font-family="Arial,sans-serif" font-size="17" font-weight="700">Writing Tools</text><text x="1280" y="192" fill="#0a91b7" font-family="Arial,sans-serif" font-size="17" font-weight="700">Compare</text><line x1="1135" y1="235" x2="1135" y2="685" stroke="#d5dce3" stroke-width="2"/><text x="820" y="260" fill="#28323d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Original — The Little Prince</text><text x="1160" y="260" fill="#28323d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Revision</text><g font-family="Arial,sans-serif" font-size="16" fill="#202832"><rect x="815" y="290" width="300" height="68" rx="7" fill="#fff"/><text x="830" y="320">The little prince watched</text><text x="830" y="343">the sunset.</text><rect x="1155" y="290" width="300" height="68" rx="7" fill="#fff8e8"/><text x="1170" y="320">The little prince watched</text><text x="1170" y="343">the sunset in silence.</text><rect x="815" y="385" width="300" height="68" rx="7" fill="#eef7fb"/><text x="830" y="415">He asked about the stars.</text><rect x="1155" y="385" width="300" height="68" rx="7" fill="#eef7fb"/><text x="1170" y="415">He asked why stars mattered.</text><rect x="815" y="480" width="300" height="68" rx="7" fill="#fff"/><text x="830" y="510">A rose waited on his planet.</text><rect x="1155" y="480" width="300" height="68" rx="7" fill="#fff8e8"/><text x="1170" y="510">A rose was waiting there.</text><rect x="815" y="575" width="300" height="68" rx="7" fill="#eef7fb"/><text x="830" y="605">Grown-ups loved numbers.</text><rect x="1155" y="575" width="300" height="68" rx="7" fill="#fff8e8"/><text x="1170" y="605">Grown-ups trusted numbers.</text></g><g font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e9eef5"><rect x="95" y="680" width="190" height="38" rx="10" fill="#111820" stroke="#2b3948"/><text x="110" y="705">Google Apps Script</text><rect x="300" y="680" width="120" height="38" rx="10" fill="#111820" stroke="#2b3948"/><text x="315" y="705">JavaScript</text><rect x="435" y="680" width="75" height="38" rx="10" fill="#111820" stroke="#2b3948"/><text x="450" y="705">HTML</text><rect x="525" y="680" width="120" height="38" rx="10" fill="#111820" stroke="#2b3948"/><text x="540" y="705">Google Docs</text></g><text x="95" y="785" fill="#98a6b5" font-family="Arial,sans-serif" font-size="18">Repositorio: Andrefnx/Writing_Toolkit</text><rect y="842" width="1600" height="58" fill="#0a0e13"/><text x="95" y="878" fill="#f3f6fa" font-family="Arial,sans-serif" font-size="20" font-weight="700">Writing Toolkit</text><text x="330" y="878" fill="#a9b5c2" font-family="Arial,sans-serif" font-size="19">Experimental tools for drafting and revision in Google Docs</text></svg>