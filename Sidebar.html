<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg-color: #f7f6f3;
      --card-bg: #ffffff;
      --border-color: #e3e1da;
      --text-main: #2c2a29;
      --text-muted: #736f6b;
      --neutral-btn: #595755;
      --neutral-btn-hover: #43413f;
      --success: #595755;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      font-size: 12px;
      color: var(--text-main);
      margin: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    

    h2.sidebar-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 2px 0;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .helper-text {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 280px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--card-bg);
      color: var(--text-main);
      box-sizing: border-box;
      resize: none;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--neutral-btn);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    button {
      background-color: var(--neutral-btn);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      width: 100%;
      transition: background-color 0.2s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    button:hover {
      background-color: var(--neutral-btn-hover);
    }

    .status {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
      font-weight: 500;
      min-height: 14px;
    }
  </style>
</head>
<body>


  <div class="editor-container">
    <textarea id="htmlOutput" placeholder="Fetching active tab or type custom text here..."></textarea>
  </div>

  <div class="button-group">
    <button onclick="loadTabContent()">Refresh & Convert Current Tab</button>
    <button onclick="transformCustomText()">Transform Text to HTML</button>
    <button onclick="copyHtml()">Copy HTML</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    window.onload = function() {
      loadTabContent();
    };

    function loadTabContent() {
      setStatus('Reading current tab...');
      google.script.run
        .withSuccessHandler(function(html) {
          document.getElementById('htmlOutput').value = html;
          setStatus('Loaded current tab successfully!');
        })
        .withFailureHandler(function(err) {
          setStatus('Error: ' + err.message);
        })
        .getCurrentTabHtml();
    }

    function transformCustomText() {
      const box = document.getElementById('htmlOutput');
      const input = box.value;
      if (!input.trim()) {
        setStatus('Box is empty!');
        return;
      }
      
      const lines = input.split('\n');
      const htmlResult = lines.map(line => line.trim() === '' ? '<br>' : `<p>${escapeHtml(line)}</p>`).join('\n');
      
      box.value = htmlResult;
      setStatus('Transformed text to HTML!');
    }

    function copyHtml() {
      const copyText = document.getElementById('htmlOutput');
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value).then(() => {
        setStatus('Copied to clipboard!');
      });
    }

    function setStatus(msg) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = msg;
      setTimeout(() => {
        if (statusEl.innerText === msg) {
          statusEl.innerText = '';
        }
      }, 2500);
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
